name = "kyoria-zip-builder"
main = "src/index.js"
compatibility_date = "2024-09-23"

# CPU headroom for CRC32 over multi-GB archives. Streaming R2 reads/writes are
# I/O-bound and barely touch CPU; this ceiling covers the checksum work.
[limits]
cpu_ms = 300000

# Bind the SAME R2 bucket the app uses. Replace with your bucket name.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "REPLACE_WITH_YOUR_R2_BUCKET"

# Queue: producer (the /enqueue endpoint) and consumer (the builder) share it.
[[queues.producers]]
binding = "ZIP_QUEUE"
queue = "kyoria-zip-builds"

[[queues.consumers]]
queue = "kyoria-zip-builds"
max_batch_size = 1      # one listing per invocation — builds can be large
max_concurrency = 2     # cap simultaneous heavy builds
max_retries = 3
max_batch_timeout = 30

[vars]
APP_URL = "https://kyoriaos.com"
# ZIP_SECRET is NOT stored here — set it as a secret (see README):
#   wrangler secret put ZIP_SECRET
